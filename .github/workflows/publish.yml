name: Publish NextGen Ads Library to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            # Strip leading 'v' if present (e.g. v1.0.0 -> 1.0.0)
            VERSION="${TAG_NAME#v}"
            echo "VERSION=$VERSION" >> $GITHUB_ENV
          else
            echo "VERSION=1.0.0" >> $GITHUB_ENV
          fi

      - name: Publish to GitHub Packages
        run: |
          ./gradlew :ads:publishReleasePublicationToGitHubPackagesRepository \
            -PPUBLISH_GROUP_ID="com.github.${{ github.repository_owner }}" \
            -PPUBLISH_ARTIFACT_ID="nextgen-ads" \
            -PPUBLISH_VERSION="${{ env.VERSION }}" \
            -Pgpr.owner="${{ github.repository_owner }}" \
            -Pgpr.repo="${{ github.event.repository.name }}" \
            -Pgpr.user="${{ github.actor }}" \
            -Pgpr.key="${{ secrets.GITHUB_TOKEN }}"
